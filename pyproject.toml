[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "printlint"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "trimesh>=4.0",
    "numpy",
    "scipy",
    "rtree",
    "defusedxml",
    "mmu-remapper",
    "networkx>=3.7",
]
[project.scripts]
printlint = "printlint.cli:main"
[dependency-groups]
dev = ["pytest", "ruff"]
[tool.uv.sources]
mmu-remapper = {path = "vendor/mmu-remapper"}
[tool.pytest.ini_options]
pythonpath = ["src", "."]
[tool.uv]
build-constraint-dependencies = ["setuptools==80.9.0"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
